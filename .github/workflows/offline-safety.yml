name: Offline source safety gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse tracked Python source and check credential-like paths
        run: python scripts/offline_safety_gate.py
      - name: Failure-injection tests for the offline gate
        run: python -m unittest discover -s tests -p 'test_offline_safety_gate.py' -v
